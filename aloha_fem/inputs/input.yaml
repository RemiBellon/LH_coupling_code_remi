# ==========================================
# ALOHA FEM - Input Configuration
# ==========================================

simulation:
  dimension: "2D"                 # "1D" (boundary only), "2D" (infinite height), "3D"
  mode: "DirectAperture"          # "DirectAperture" or "ExplicitGeometry"
  box_medium: "PLASMA"            #  "PLAMSA" or "VACUUM"
  boundary_toroidal: "periodic"   # "periodic", "pec", or "pml"
  boundary_poloidal: "pec"        # "periodic", "pec", or "pml" (used in 3D)
  
physics:
  wave:
    freq_LH: 3.7e9
    n_para_req: 2.0               # Used for initial phasing estimates or 1D mode

  plasma:
    b_field_profile:
      type: "piecewise"
      points:
        - [0.00, 3.7]             # B field at the antenna mouth
        - [0.05, 3.7]             # B field in the core
      segments:
        - "constant"

    pitch_angle_profile:
      type: "piecewise"
      points:
        - [0.00, 0.0]             # 5 degrees at the edge
        - ["Lx_plasma", 0.0]      # 2 degrees in the core
      segments:
        - "linear"

    radial_density_profile:               # Piecewise radial profile builder
      type: "piecewise"
      points:                     # [x_position, electron_density]
        - [0.00, 5.0e17]          # Point 0: Antenna mouth
        - [0.002, 1.0e18]         # Point 1: SOL boundary
        - ["Lx_plasma", 3.4e18]          # Point 2: Core gradient end
      segments:                   # Mathematical link between points
        - "exponential"           # Links Point 0 to Point 1
        - "linear"                # Links Point 1 to Point 2


    toroidal_density_profile:             # Toroidally, the density might be flat, or have a slight ripple/gradient
      type: "constant"

geometry:
  antenna:                        # The antenna is physically defined here, regardless of 2D or 3D simulation
    topology: "FAM"               # "FAM" (Fully Active) or "PAM" (Passive Active)
    dimensions:
      wg_width: 0.042             # Waveguide Toroidal width (m)
      wg_height: 0.07             # Vertical height (m). In 3D: true geom. In 2D: used for Watts -> Watts/m conversion.
      wg_length_active: 0.08      # Depth of the driven channels (m)
      wg_length_passive: 0.02     # Depth of the short-circuited channels (m)
      septa_width: 0.002          # Metal thickness between waveguides (m)
      corner_radius: 0.001        # radius of septa rounded corner 

    grill_arrangement:
      num_rows: 1
      row_spacing: 0.02                     # Poloidal space between rows (m)
      num_modules: 1
      active_waveguides_per_module: [6]  # The length of these lists MUST match num_modules
      power_per_module_W: [6.0]
      phase_shift_per_module_deg: [-90.0]

  domain:
    Lx_plasma: 0.05               # (m)
    Lx_pml: 0.03                  # (m)
    # Lz_plasma: 0.60               # (m) Must be wide enough to fit the modules defined above
    Lz_pml: 0.20                  # (m)
    Lz_wall: 0.05                 # (m)
    Ly_plasma: 0.10               # (m) Poloidal height (required for 3D)
    Ly_pml: 0.05                  # (m)
    Ly_wall: 0.02                 # (m)


  mesh:
    ppw_medium: 5.0              # Points per wavelength in bulk
    ppw_pml: 10.0                 # Points per wavelength in PML
    grading: 0.15                 # Max element size growth rate (15%) for smoothed refinement

  pml:
    use_radial: true
    use_toroidal: true
    use_poloidal: false
    Sx_r: 2.0
    Sx_im: 2.0
    px: 2.5
    Sz_r: 1.88
    Sz_im: 4.0
    pz: 3.0

solver:
  fem_order: 3                    # Polynomial degree for Hcurl/H1 spaces
  linear_backend: "mumps"         # Direct solver choice: "mumps", "umfpack", "pardiso"
  max_threads: 8                  # Number of OpenMP/NGSolve threads to allocate